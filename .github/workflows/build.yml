name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every schema parses as Avro
        run: |
          python -m pip install --quiet fastavro
          python - <<'PY'
          import glob, sys
          from fastavro.schema import load_schema
          failed = False
          for path in sorted(glob.glob("stube/**/*.avsc", recursive=True)):
              try:
                  load_schema(path)
                  print(f"ok   {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  library:
    # Storage schemas for the library (manifest / metadata).
    # Checks that every schema is valid JSON Schema 2020-12 with all $refs
    # resolving, and that the example documents conform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "jsonschema[format-nongpl]>=4.23" referencing
      - run: python tools/validate-library.py --check-checksums library/v1/examples
      - name: the validator rejects broken libraries
        run: python tools/test-validate-library.py
      - run: python -m py_compile tools/library-migrate.py tools/make-library-examples.py tools/test-validate-library.py tools/package-checksums.py
      - name: examples are up to date with their generator
        run: python tools/make-library-examples.py && git diff --exit-code -- library/v1/examples

  library-v2:
    # The record layout: item / metadata / source / version / package / event.
    # Same checks as v1, against library/v2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "jsonschema[format-nongpl]>=4.23" referencing
      - run: python tools/validate-library-v2.py --check-checksums library/v2/examples
      - name: the validator rejects broken libraries
        run: python tools/test-validate-library-v2.py
      - run: python -m py_compile tools/make-library-v2-examples.py tools/test-validate-library-v2.py
      - name: examples are up to date with their generator
        run: python tools/make-library-v2-examples.py && git diff --exit-code -- library/v2/examples
